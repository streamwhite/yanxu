<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>auto-upload — 设置</title>
  <link rel="stylesheet" href="./dist/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="./options.css" />
</head>

<body class="bg-body-tertiary">
  <main class="options-shell container py-4">
    <header class="mb-4">
      <h1 class="h5 mb-1 fw-semibold">auto-upload 设置</h1>
      <p class="text-muted small mb-0">
        视频号发布采用分批方式，每批之间暂停以降低触发限流的风险。
      </p>
    </header>

    <section class="card">
      <div class="card-body">
        <h2 class="h6 fw-semibold mb-3">视频号发布</h2>
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label small fw-semibold" for="channelsSubmitBatchSizeInput">
              视频号每批数量
            </label>
            <input id="channelsSubmitBatchSizeInput" class="form-control form-control-sm" type="number" min="1"
              max="20" step="1" />
            <p class="form-text small mb-0">每批提交的标签页数量。</p>
          </div>
          <div class="col-sm-6">
            <label class="form-label small fw-semibold" for="channelsSubmitBatchIntervalMinInput">
              批次间隔（分钟）
            </label>
            <input id="channelsSubmitBatchIntervalMinInput" class="form-control form-control-sm" type="number" min="1"
              max="60" step="1" />
            <p class="form-text small mb-0">每批之间的暂停时间。</p>
          </div>
        </div>
        <p id="channelsBatchSettingsSavedStatus" class="form-text small text-success mb-0 mt-3 d-none" role="status"
          aria-live="polite"></p>
      </div>
    </section>

    <section class="card mt-3">
      <div class="card-body">
        <h2 class="h6 fw-semibold mb-3">上传与填充</h2>
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label small fw-semibold" for="fieldsSettleMsInput">
              上传后、填充前的等待时间（毫秒）
            </label>
            <input id="fieldsSettleMsInput" class="form-control form-control-sm" type="number" min="0" max="120000"
              step="500" />
            <p class="form-text small mb-0">等待页面稳定后再填充字段和封面。</p>
          </div>
        </div>
        <p id="fieldsSettleMsSavedStatus" class="form-text small text-success mb-0 mt-3 d-none" role="status"
          aria-live="polite"></p>
      </div>
    </section>
  </main>
  <script type="module" src="./dist/options.js"></script>
</body>

</html>
