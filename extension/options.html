<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>雁序 — 设置</title>
  <link rel="stylesheet" href="./dist/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="./options.css" />
</head>

<body class="bg-body-tertiary">
  <main class="options-shell container py-4">
    <header class="mb-4">
      <h1 class="h5 mb-1 fw-semibold">雁序设置</h1>
    </header>

    <section class="card">
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2">
          <button id="chooseBrowserJobFileButton" class="btn btn-outline-primary btn-sm" type="button">
            任务文件
          </button>
          <button id="chooseBrowserAssetsDirButton" class="btn btn-outline-primary btn-sm" type="button">
            素材文件夹
          </button>
          <button id="restoreBrowserSourcePermissionButton" class="btn btn-outline-secondary btn-sm d-none"
            type="button">
            恢复访问
          </button>
          <button id="clearBrowserFileSourceButton" class="btn btn-link btn-sm p-0 text-secondary d-none" title="清除"
            aria-label="清除" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"
              aria-hidden="true">
              <path
                d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z" />
              <path
                d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z" />
            </svg>
          </button>
        </div>
        <p id="browserFileSourceStatus" class="form-text small text-muted mb-0 mt-2" role="status" aria-live="polite">
        </p>
      </div>
    </section>

    <section class="card mt-3">
      <div class="card-body">
        <h2 class="h6 fw-semibold mb-3">视频号设置</h2>
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label small fw-semibold" for="channelsSubmitBatchSizeInput">
              每批数量
            </label>
            <input id="channelsSubmitBatchSizeInput" class="form-control form-control-sm" type="number" min="1" max="20"
              step="1" />
            <p class="form-text small mb-0">每批提交的标签页数量。</p>
          </div>
          <div class="col-sm-6">
            <label class="form-label small fw-semibold" for="channelsSubmitBatchIntervalSecondsInput">
              批次间隔（秒）
            </label>
            <input id="channelsSubmitBatchIntervalSecondsInput" class="form-control form-control-sm" type="number"
              min="1" max="60" step="1" />
            <p class="form-text small mb-0">每批之间的暂停时间。</p>
          </div>
        </div>
        <p id="channelsBatchSettingsSavedStatus" class="form-text small text-success mb-0 mt-3 d-none" role="status"
          aria-live="polite"></p>
      </div>
    </section>
  </main>
  <script type="module" src="./dist/options.js"></script>
</body>

</html>
