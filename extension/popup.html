<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>雁序 — 多平台投稿助手</title>
  <link rel="stylesheet" href="./dist/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="./popup.css" />
</head>

<body class="bg-body-tertiary">
  <main class="popup-shell container-fluid py-3">
    <header class="mb-3 d-flex align-items-center justify-content-between">
      <h1 class="h6 mb-1 fw-semibold">雁序</h1>
      <button id="copyBatchProgressLogButton" type="button" class="btn btn-link btn-sm p-0 text-secondary"
        title="复制日志" aria-label="复制日志">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"
          aria-hidden="true">
          <path
            d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1z" />
          <path
            d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0z" />
        </svg>
      </button>
    </header>

    <section class="workflow-step" aria-labelledby="stepPrepareTitle">
      <h2 id="stepPrepareTitle" class="workflow-step-heading">
        <span class="workflow-step-number" aria-hidden="true">01</span>
        <span>准备</span>
      </h2>
      <div class="mb-2">
        <label class="form-label small fw-semibold" for="jobFilePathInput">任务文件路径</label>
        <input id="jobFilePathInput" class="form-control form-control-sm font-monospace" type="text"
          placeholder="/绝对路径/到/batch.job.json" autocomplete="off" spellcheck="false" />
      </div>

      <div>
        <label class="form-label small fw-semibold" for="batchPlatformScopeSelect">平台范围</label>
        <select id="batchPlatformScopeSelect" class="form-select form-select-sm mb-2">
          <option value="all">全部平台</option>
          <option value="bilibili">仅bilibili</option>
          <option value="douyin">仅抖音</option>
          <option value="channels">仅视频号</option>
        </select>
        <p id="batchPlatformScopeHelp" class="form-text small text-muted mb-2 d-none"></p>
        <div id="platformItemSelectionSection" class="d-none mb-2">
          <label id="platformItemSelectionLabel" class="form-label small fw-semibold mb-1">待上传条目</label>
          <div id="platformItemSelectionList" class="platform-item-selection-list border rounded p-2 bg-white"></div>
          <p class="form-text small text-muted mb-0 mt-1">
            取消勾选已上传的条目。上传与填充只对勾选的条目执行。
          </p>
        </div>
      </div>
    </section>

    <section class="workflow-step" aria-labelledby="stepUploadFillTitle">
      <h2 id="stepUploadFillTitle" class="workflow-step-heading">
        <span class="workflow-step-number" aria-hidden="true">02</span>
        <span>上传和填写</span>
      </h2>
      <div class="form-check mb-2">
        <input id="submitHorizontalCoverCheckbox" class="form-check-input" type="checkbox" />
        <label class="form-check-label small" for="submitHorizontalCoverCheckbox">
          提交横向图片
        </label>
      </div>
      <div class="d-grid">
        <button id="uploadAndFillAllTabsButton" type="button" class="btn btn-primary btn-sm">
          开始
        </button>
      </div>
    </section>

    <section class="workflow-step" aria-labelledby="stepPublishTitle">
      <h2 id="stepPublishTitle" class="workflow-step-heading">
        <span class="workflow-step-number" aria-hidden="true">03</span>
        <span>发布（审核后）</span>
      </h2>
      <div class="d-grid">
        <button id="submitAllPlatformsButton" type="button" class="btn btn-outline-primary btn-sm">
          提交
        </button>
      </div>
    </section>

    <pre id="batchProgressLog" class="d-none" hidden aria-hidden="true"></pre>

    <div id="autoUploadOutcome" class="alert alert-secondary small mb-0 mt-3 d-none" role="status" aria-live="polite">
    </div>
  </main>
  <script type="module" src="./dist/popup.js"></script>
</body>

</html>
